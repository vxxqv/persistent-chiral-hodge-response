[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persistent-chiral-hodge-response"
version = "0.2.0"
description = "Orientation-covariant chiral sources and persistent Hodge responses"
authors = [{name = "Vivaan Patni"}]
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["numpy>=2.0", "scipy>=1.14", "rdkit>=2025.3", "matplotlib>=3.9", "sympy>=1.13", "gudhi>=3.10", "pandas>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8", "scikit-learn>=1.6"]
external = ["pyarrow>=18"]
figures = ["pyvista>=0.49", "pandas>=2.2", "pillow>=11", "colorspacious>=1.1", "resvg-py>=0.5", "pymupdf>=1.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
